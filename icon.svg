<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Gauge Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="24" stroke-linecap="round" stroke-dasharray="800" stroke-dashoffset="250" />
  <!-- Active Gauge Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" stroke-dasharray="800" stroke-dashoffset="480" />

  <!-- Car Silhouette / Steering Wheel -->
  <g transform="translate(106, 126)">
    <!-- Car body shape -->
    <path d="M45 180 L75 110 C85 85, 110 70, 140 70 L160 70 C190 70, 215 85, 225 110 L255 180 L280 185 C295 188, 300 200, 300 215 L300 240 C300 250, 290 260, 280 260 L20 260 C10 260, 0 250, 0 240 L0 215 C0 200, 5 188, 20 185 Z" fill="#38bdf8" opacity="0.95"/>
    <!-- Car Windows -->
    <path d="M85 115 L140 115 L140 165 L60 165 Z" fill="#0f172a" />
    <path d="M160 115 L215 115 L240 165 L160 165 Z" fill="#0f172a" />
    <!-- Headlights -->
    <circle cx="45" cy="215" r="14" fill="#fbbf24" />
    <circle cx="255" cy="215" r="14" fill="#fbbf24" />
    <!-- Wheels -->
    <circle cx="65" cy="260" r="32" fill="#020617" stroke="#64748b" stroke-width="8" />
    <circle cx="235" cy="260" r="32" fill="#020617" stroke="#64748b" stroke-width="8" />
    <circle cx="65" cy="260" r="12" fill="#e2e8f0" />
    <circle cx="235" cy="260" r="12" fill="#e2e8f0" />
  </g>

  <!-- Currency / Wrench badge -->
  <circle cx="370" cy="140" r="54" fill="url(#emeraldGrad)" stroke="#0f172a" stroke-width="8" />
  <text x="370" y="152" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
</svg>
